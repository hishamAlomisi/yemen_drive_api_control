<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#102a24">
  <title>مشاركة رحلة يمن درايف</title>
  <link rel="stylesheet" href="/vendor/leaflet/leaflet.css">
  <style>
    :root { color-scheme: light; font-family: system-ui, "Segoe UI", sans-serif; background: #f4f7f5; color: #17241f; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 20px; }
    main { width: min(900px, 100%); overflow: hidden; border-radius: 20px; background: #fff; box-shadow: 0 18px 60px #102a2417; }
    header { padding: 20px 24px; background: #102a24; color: #fff; }
    h1 { margin: 0 0 8px; font-size: 1.25rem; }
    #status { color: #d5e5de; font-size: .95rem; }
    #message { min-height: 25px; padding: 12px 24px 0; color: #53665d; }
    #route { padding: 8px 24px 14px; font-weight: 600; }
    #map { height: min(68vh, 620px); min-height: 360px; background: #e8eeeb; }
    .driver-marker { display: grid; place-items: center; width: 42px; height: 42px; border: 3px solid white; border-radius: 50%; background: #147d5a; color: white; box-shadow: 0 2px 10px #102a2466; }
    .driver-marker span { display: block; font-size: 21px; line-height: 1; }
    @media (max-width: 520px) { body { padding: 0; } main { min-height: 100vh; border-radius: 0; } #map { height: 68vh; } }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>مشاركة رحلة يمن درايف</h1>
      <div id="status" role="status" aria-live="polite">جارٍ التحقق من رابط المشاركة…</div>
    </header>
    <div id="message" role="status" aria-live="polite"></div>
    <div id="route">جارٍ تحميل تفاصيل الرحلة…</div>
    <div id="map" aria-label="خريطة الرحلة المشتركة"></div>
  </main>
  <script src="/vendor/signalr/signalr.min.js"></script>
  <script src="/vendor/leaflet/leaflet.js"></script>
  <script src="/shared-ride.js?v=20261019-route-change"></script>
</body>
</html>
